meta:
  environment: nodejs
  port: 3000
  toolchain:
    name: npm
    version: 20
build:
  steps:
    - name: Generate Prisma Client
      command: npx prisma generate
    - name: Build Next.js
      command: npm run build
run:
  persistence:
    - mountPath: /app/prisma-data
      name: data
  command: npx prisma db push && npm run start
